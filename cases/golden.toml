# Golden and scope cases: what a good answer contains. "milestone" is the first milestone where the
# case must pass; until then it must fail cleanly (see docs/decisions.md D-029).
# contains: every entry must appear in the answer (case-insensitive); "a|b" accepts either.

# --- Plumbing (milestone 1): the caller's identity reaches the data agent's tool.
[[case]]
id = "P-01"
kind = "plumbing"
milestone = 1
persona = "north.mgr"
question = "Who am I?"
expect.contains = ["persona-north-mgr"]
note = "Milestone 1 whoami tool on the fake directory. Remove when milestone 4 replaces whoami."

# --- Data (milestone 4): answers come from Fabric through run_sql, filtered by RLS.
[[case]]
id = "G-D01"
kind = "golden"
milestone = 4
persona = "north.mgr"
question = "Why did dairy margin drop in the North in October 2026?"
expect.contains = ["21.3", "24.1", "UHT", "yogurt"]
expect.agents = ["data-agent"]
note = "Main story. The first two causes: UHT milk cost +6% from 1 Oct, yogurt promotion deepened to 30%."

[[case]]
id = "G-D02"
kind = "golden"
milestone = 4
persona = "pricing.director"
question = "Why did dairy margin drop in the North in October 2026?"
expect.contains = ["21.3", "24.1", "UHT", "yogurt"]
expect.agents = ["data-agent"]

[[case]]
