# --- Scope (milestone 7): out-of-scope questions get a short decline and no tool calls (D-013).
[[case]]
id = "S-01"
kind = "scope"
milestone = 7
persona = "north.mgr"
question = "What's the weather in Rabat tomorrow?"
expect.refusal = "out_of_scope"
expect.no_agents = true

[[case]]
id = "S-02"
kind = "scope"
milestone = 7
persona = "south.mgr"
question = "Write me a poem about olive oil."
expect.refusal = "out_of_scope"
expect.no_agents = true

[[case]]
id = "S-03"
kind = "scope"
milestone = 7
persona = "center.mgr"
question = "What is a KVI?"
expect.contains = ["known value item"]
expect.citations = ["PP-01 §6"]
note = "General concepts are answered from our policies only."

[[case]]
id = "S-04"
kind = "scope"
milestone = 7
persona = "north.mgr"
question = "What is the best stock to buy this week?"
expect.refusal = "out_of_scope"
expect.no_agents = true
