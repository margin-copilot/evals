# --- Actions (milestone 6): drafts are pending until a person approves them.
[[case]]
id = "G-A01"
kind = "golden"
milestone = 6
persona = "north.mgr"
question = "Draft a proposal to raise UHT milk 1 L in the North to 7.25 MAD."
expect.contains = ["pending", "7.25"]
expect.agents = ["action-agent"]

[[case]]
id = "G-A02"
kind = "golden"
milestone = 6
persona = "center.mgr"
question = "Draft a 7% increase for olive oil 1 L in the Center."
expect.contains = ["pending", "director"]
expect.agents = ["action-agent"]
note = "Over the 4% Tier B limit: the draft is allowed, but only the director can approve it."

[[case]]
id = "G-A03"
kind = "golden"
milestone = 6
persona = "north.mgr"
question = "Draft a 2% increase for UHT milk 1 L in the South."
expect.refusal = "no_access"
note = "A manager drafts only for their own region."

# --- Combined (milestone 7): the orchestrator joins data, policy and actions in one answer.
[[case]]
id = "G-C01"
kind = "golden"
milestone = 7
persona = "north.mgr"
question = "Why did North dairy margin drop in October 2026, and what should we do about it?"
expect.contains = ["UHT", "7.25"]
expect.agents = ["data-agent", "policy-agent"]
expect.citations = ["PP-04 §3.2"]

[[case]]
id = "G-C02"
kind = "golden"
milestone = 7
persona = "pricing.director"
question = "Was the North flour increase in February 2026 allowed?"
expect.contains = ["Ramadan"]
expect.agents = ["data-agent", "policy-agent"]
expect.citations = ["PP-07 §2"]

[[case]]
id = "G-C03"
kind = "golden"
milestone = 7
persona = "center.mgr"
